name: CI — AgriDisease Detector

on:
  push:
    branches: [main, ashwani, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors pytest pytest-cov pillow numpy

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Lint check
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --ignore=E501,W503 || true
